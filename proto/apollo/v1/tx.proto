// Sending actions and following what became of them.
syntax = "proto3";

package apollo.v1;

import "apollo/v1/common.proto";

service TxService {
  // Submit signed actions. Returns once they are accepted or refused;
  // execution comes later: see GetActionStatus.
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  // What became of actions, by account and nonce.
  rpc GetActionStatus(GetActionStatusRequest) returns (GetActionStatusResponse);
  // One executed signed action, by its transaction hash.
  rpc GetTransaction(GetTransactionRequest) returns (Transaction);
  // An account's action allowance.
  rpc GetAllowance(GetAllowanceRequest) returns (GetAllowanceResponse);
}

// One signed action: the 48-byte action encoding and the 78-byte auth
// (nonce and signature).
message SignedAction {
  bytes action = 1;
  bytes auth = 2;
}

message SubmitRequest {
  // Echoed in the response.
  uint64 id = 1;
  repeated SignedAction actions = 2;
}

enum SubmitStatus {
  SUBMIT_STATUS_UNSPECIFIED = 0;
  // Accepted; it will be executed.
  SUBMIT_STATUS_ACCEPTED = 1;
  // The action or auth bytes do not decode.
  SUBMIT_STATUS_MALFORMED = 2;
  // The signature does not verify against the account's keys.
  SUBMIT_STATUS_BAD_SIGNATURE = 3;
  // Temporarily unavailable: retry.
  SUBMIT_STATUS_UNAVAILABLE = 4;
}

message SubmitResponse {
  uint64 id = 1;
  // One per action, in request order.
  repeated SubmitStatus statuses = 2;
  // Why, for the statuses that are not ACCEPTED.
  string detail = 3;
  // Canonical transaction hashes for accepted signed actions, in request
  // order. A rejected action has an empty entry.
  repeated bytes transaction_hashes = 4;
}

message ActionKey {
  uint64 account = 1;
  uint64 nonce = 2;
}

enum ActionState {
  ACTION_STATE_UNSPECIFIED = 0;
  // Not executed yet, or never received.
  ACTION_STATE_NOT_FOUND = 1;
  // Executed; outcome below.
  ACTION_STATE_EXECUTED = 2;
  // The nonce is used, but its result is no longer retained here.
  ACTION_STATE_NONCE_USED = 3;
}

message ActionStatus {
  ActionKey key = 1;
  ActionState state = 2;
  // With EXECUTED: the block it ran in.
  uint64 height = 3;
  // With EXECUTED: true if it took effect.
  bool ok = 4;
  // With EXECUTED and not ok: the reject reason, e.g.
  // "InsufficientMargin", "BadNonce".
  string reject = 5;
  // With EXECUTED: the order a Place or Modify created (its nonce).
  optional uint64 order_id = 6;
  // With EXECUTED: fills it caused directly.
  uint32 fills = 7;
}

message GetActionStatusRequest {
  repeated ActionKey keys = 1;
}

message GetActionStatusResponse {
  At at = 1;
  // One per key, in request order.
  repeated ActionStatus statuses = 2;
}

message GetTransactionRequest {
  bytes transaction_hash = 1;
}

message Transaction {
  bytes transaction_hash = 1;
  uint64 height = 2;
  uint32 index = 3;
  bool ok = 4;
  string reject = 5;
  bytes action = 6;
  bytes auth = 7;
}

message GetAllowanceRequest {
  uint64 account = 1;
}

message GetAllowanceResponse {
  At at = 1;
  // Actions counted so far (everything but cancels, rejected ones too).
  uint64 used = 2;
  // Actions allowed: the base plus one per whole dollar filled.
  uint64 limit = 3;
  uint64 remaining = 4;
  uint64 volume_usd = 5;
}
